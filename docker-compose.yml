services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: clinicflow
      POSTGRES_DB: clinicflow
    ports:
      - '5433:5432'
    volumes:
      - clinicflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinicflow -d clinicflow']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: clinicflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://clinicflow:clinicflow@postgres:5432/clinicflow?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '4000:3000'

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
    VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: clinicflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  clinicflow_pg:
